name: moneytracker
description: "Money Tracker — a personal finance tracking app built with Flutter, following Clean Architecture and modern Android/iOS development practices."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  country_flags: ^3.1.0
  crypto: ^3.0.5
  cupertino_icons: ^1.0.8
  currency_text_input_formatter: ^2.2.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  intl: any
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  path: ^1.8.3
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.3
  sqflite: ^2.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.5
  riverpod_generator: ^2.6.3
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/flags/eu.webp
    - assets/images/profile.png
    - assets/icons/app_icon.png
    - assets/icons/app_icon_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FAFAFA"
  image: assets/icons/app_icon_splash.png

  color_dark: "#121212"
  image_dark: assets/icons/app_icon_splash.png

  android_12:
    color: "#FAFAFA"
    image: assets/icons/app_icon_splash.png
    color_dark: "#121212"
    image_dark: assets/icons/app_icon_splash.png

  android: true
  ios: true